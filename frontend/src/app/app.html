<nav class="navbar navbar-expand-lg app-navbar">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center gap-2" routerLink="/">
      <span class="brand-mark">🎓</span> AcademicSync
    </a>
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#mainNav"
      aria-controls="mainNav"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/materias" routerLinkActive="active">
            Materias
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/tareas" routerLinkActive="active">
            Tareas
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/planeacion" routerLinkActive="active">
            Planeación
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/pensum" routerLinkActive="active">
            Pensum
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/ia" routerLinkActive="active">
            Centro de IA
          </a>
        </li>
      </ul>

      <div class="d-flex align-items-center gap-2">
        <button
          class="theme-toggle"
          type="button"
          (click)="toggleTheme()"
          [title]="isDark() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
          aria-label="Cambiar tema"
        >
          @if (isDark()) {
            <!-- Sol -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
            </svg>
          } @else {
            <!-- Luna -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
            </svg>
          }
        </button>

        @if (authState().authenticated) {
          <span class="auth-pill">
            <span class="auth-avatar">
              {{ (authState().email || 'U').charAt(0).toUpperCase() }}
            </span>
            <span class="auth-email text-truncate">
              {{ authState().email || 'Conectado' }}
            </span>
          </span>
          <button class="btn btn-outline-secondary btn-sm" (click)="logout()">
            Salir
          </button>
        } @else {
          <button class="btn btn-primary btn-sm" (click)="login()">
            <span class="me-1">🔗</span> Conectar con Google
          </button>
        }
      </div>
    </div>
  </div>
</nav>

<main class="container py-4">
  <router-outlet />
</main>
