<nav class="navbar navbar-expand-lg app-navbar">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center gap-2" routerLink="/">
      <span class="brand-mark">🎓</span> AcademicSync
    </a>
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#mainNav"
      aria-controls="mainNav"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/materias" routerLinkActive="active">
            Materias
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/tareas" routerLinkActive="active">
            Tareas
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/planeacion" routerLinkActive="active">
            Planeación
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/ia" routerLinkActive="active">
            Centro de IA
          </a>
        </li>
      </ul>

      <div class="d-flex align-items-center gap-2">
        @if (authState().authenticated) {
          <span class="auth-pill">
            <span class="auth-avatar">
              {{ (authState().email || 'U').charAt(0).toUpperCase() }}
            </span>
            <span class="auth-email text-truncate">
              {{ authState().email || 'Conectado' }}
            </span>
          </span>
          <button class="btn btn-outline-secondary btn-sm" (click)="logout()">
            Salir
          </button>
        } @else {
          <button class="btn btn-primary btn-sm" (click)="login()">
            <span class="me-1">🔗</span> Conectar con Google
          </button>
        }
      </div>
    </div>
  </div>
</nav>

<main class="container py-4">
  <router-outlet />
</main>
